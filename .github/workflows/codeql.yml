name: CodeQL

# CodeQL advanced setup, so that .github/codeql/codeql-config.yml's
# `paths-ignore` is honoured. Languages: GitHub Actions and JavaScript/TypeScript
# (the single CodeQL language covering both). Query suite: security-extended.
# Default setup MUST be disabled in repo settings for this workflow's results to
# be accepted (the two are mutually exclusive).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, mirroring the retired default-setup cadence.
    - cron: '31 4 * * 1'

# Cancel superseded runs for the same PR ref; never cancel push runs on main.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required to upload code-scanning results.
      security-events: write
      # Needed by the CodeQL Action to read the workflow run (private repos).
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: '/language:${{ matrix.language }}'
