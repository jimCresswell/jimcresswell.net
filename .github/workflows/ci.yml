name: CI

# The PR-gating workflow. Parity with the root `check` script is enforced by
# `pnpm --filter @engraph/agent-tools validate-check-ci-parity`: every leg of
# `check` must appear as a run step here, so the local gate and the merge
# gate can never drift apart.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          bin_dir="${RUNNER_TEMP}/bin"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          mkdir -p "${bin_dir}"
          tar --extract --gzip --file "${archive}" --directory "${bin_dir}" gitleaks
          echo "${bin_dir}" >> "${GITHUB_PATH}"
      - uses: ./.github/actions/setup
      - name: Scan for secrets
        run: pnpm secrets:scan

  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

  static-checks:
    name: static-checks
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: pnpm format-check:root
      - name: Check markdown
        run: pnpm markdownlint-check:root
      # The installer puts the pinned shellcheck in the checkout's .tools/bin,
      # which the gate runs in preference to any shellcheck the image ships;
      # the gate prints the version and the binary it ran.
      - name: Install pinned shellcheck
        run: ./.agent/setup/install-shellcheck.sh
      - name: Lint shell scripts
        run: pnpm lint:shell
      - name: Lint runtime-only scripts
        run: pnpm lint:runtime-only
      - name: Validate sub-agents
        run: pnpm subagents:check
      - name: Validate portability
        run: pnpm portability:check
      - name: Validate skills adapters
        run: pnpm skills:check
      - name: Validate encoding
        run: pnpm encoding:check
      - name: Docs validators
        run: pnpm docs-validators:check
      - name: Repo validators
        run: pnpm repo-validators:check
      - name: Unused code (knip)
        run: pnpm knip
      - name: Dependency boundaries (depcruise)
        run: pnpm depcruise

  build-and-test:
    name: build-and-test
    needs: install
    # The one job that runs turbo, so the one that reaches the Turbo remote
    # cache. The cache is optional: this repository enables it, a fork or a
    # clone need not. It is reached by GitHub OIDC, never by a long-lived
    # secret: the step below exchanges the job's OIDC token for a short-lived
    # Vercel token against the team's OIDC policy for this repository, sets
    # TURBO_TOKEN and TURBO_TEAM for the following steps and revokes the token
    # when the job ends. That needs `id-token: write`; a job-level block
    # replaces the workflow's, so `contents: read` is restated.
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Turbo remote cache by OIDC
        id: turbo-remote-cache
        # The step runs only where an OIDC token can exist and a team is named:
        # a fork's or Dependabot's pull request has no usable token, and a fork
        # or a clone without the TURBO_TEAM repository variable names no team.
        # It never fails the job either: the cache is a speed-up, not a gate,
        # so a refused exchange shows as this step's own red mark and turbo
        # runs on its local cache. The next step says so in either case.
        if: vars.TURBO_TEAM != '' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}
      - name: Turbo remote cache not in use
        if: steps.turbo-remote-cache.outcome != 'success'
        run: >-
          echo "::notice title=Turbo remote cache::Not in use for this run
          (${{ steps.turbo-remote-cache.outcome }}); turbo uses its local cache.
          To share a cache, configure an optional remote Turbo cache: a TURBO_TEAM
          repository variable and a Vercel OIDC policy for this repository
          (docs/engineering/build-system.md, Caching)."
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm type-check
      - name: Unit and integration tests
        run: pnpm test
      - name: Agent-tools end-to-end and smoke suite
        run: pnpm agent-tools:test:e2e

  e2e:
    name: e2e
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install Puppeteer browser
        run: pnpm --filter @jimcresswell/www exec puppeteer browsers install chrome
      - name: Install Playwright browser
        run: pnpm --filter @jimcresswell/www exec playwright install --with-deps chromium
      - name: Site end-to-end suite
        run: pnpm --filter @jimcresswell/www test:e2e
