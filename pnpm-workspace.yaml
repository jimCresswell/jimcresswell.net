packages:
  - agent-tools
  - jcdotnet
  - tooling/*
# Supply-chain hardening: exclude any package version younger than 24h
# (1440 min) from resolution, so a freshly-published compromised release ages —
# giving the ecosystem time to detect and yank it — before it can enter the
# tree. pnpm's default is 0 (no floor); this line introduces the floor.
# Mechanism, verified first-hand 2026-08-11 on pnpm 11.20 — two outcomes:
# when the requested range admits an older mature version, the resolver
# SILENTLY picks the newest version older than the floor (exit 0, no
# warning, no prompt) — a just-published release simply stays out of
# resolution until it ages past the floor. The exclusion is INVISIBLE to
# `pnpm outdated` too: its "latest" is computed under the same floor, so
# age-floored rows read current — surface them from publish-date reads
# (`pnpm view <pkg> time`), never from outdated's silence. When NOTHING
# mature satisfies the request (an exact pin to a too-young version),
# pnpm instead refuses loudly with ERR_PNPM_NO_MATURE_MATCHING_VERSION,
# naming each too-young package.
# Applies to all (incl. transitive) deps at resolution time; frozen-lockfile
# installs (CI) are unaffected. Allow-list a genuinely-needed young package
# via minimumReleaseAgeExclude.
minimumReleaseAge: 1440

allowBuilds:
  esbuild: true
  unrs-resolver: true
  sharp: true
  puppeteer: true
peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: '10'
    eslint-plugin-import-x>eslint: '10'
    eslint-plugin-react>eslint: '10'
    eslint-plugin-react-hooks>eslint: '10'
overrides:
  # Pin @types/node to the Node 24 LTS line across the whole tree, including
  # transitive peers (vite/vitest pull @types/node@26 as an optional peer).
  # Matches engines.node 24.x and keeps every workspace — including those that
  # do not declare @types/node directly — compiling against Node 24 types.
  # This override IS the hold — lift it when the project moves Node majors
  # (docs/engineering/build-system.md §Dependency updates).
  '@types/node': '^24.13.3'
  # Security floor per major line. The tree holds two lines, each through
  # minimatch: 1.x through minimatch 3 (ESLint 9 and the eslint-plugin-import,
  # -jsx-a11y and -react plugins), 5.x through minimatch 10 (ESLint 10,
  # typescript-estree, eslint-plugin-import-x, eslint-plugin-sonarjs and
  # tooling/eslint). Lint tooling only. Scoped per major (2026-09-12): an
  # unscoped 5.x floor broke minimatch 3's resolver at lint time, so each line
  # keeps its own patched floor, bounded below its next major, and no dependent
  # crosses one. A new consumer on another major gets no floor from these
  # entries; the advisory check at its dependency landing must catch it.
  # Floors: the brace-expansion repository's advisories of 2026-09-14,
  # GHSA-6j4f-fj2g-mc7p and GHSA-qhr7-859c-m2p7 (maintainer severity high;
  # stack exhaustion through uncontrolled recursion) and GHSA-q2hr-2g5m-vwhr
  # (maintainer severity medium; quadratic-time rewrite), patched in 1.1.21 and
  # 5.0.12. They were absent from GitHub's reviewed database on 2026-09-17,
  # whose newest entry then, GHSA-rgw5-rvv9-x895 (high), is patched in 1.1.18
  # and 5.0.9.
  # Remove a line's entry when its dependents declare at least its floor
  # (minimatch 3.1.5 declares ^1.1.7; minimatch 10.2.6 declares ^5.0.8).
  'brace-expansion@1': '>=1.1.21 <2'
  'brace-expansion@5': '>=5.0.12 <6'
  # Security floor that deliberately crosses tsup and vite onto the 0.28 line.
  # GHSA-g7r4-m6w7-qqqr (low; esbuild's development server allows arbitrary
  # file reads on Windows) affects >=0.27.3 <0.28.1, with no patched 0.27
  # release. tsup 8.5.1 and vite 7.3.5 declare esbuild ^0.27.0, which resolves
  # 0.27.7, so without this crossing pnpm audit reports the advisory; tsx
  # declares ~0.28.0 (which admits 0.28.0), bundle-require's peer >=0.18,
  # agent-tools ^0.28.2. Not reachable here: tsup, vite, tsx and this
  # repository's code never call esbuild's serve API, and the flaw is
  # Windows-only. Safe to cross: 0.28.0's breaking changes are an integrity
  # check in the install script's fallback download, the Go 1.26 toolchain and
  # text import attributes, none of them the build or transform API that tsup
  # and vite call; every tsup build and vitest run passes on 0.28. The floor is
  # agent-tools' ^0.28.2, and the override REWRITES that manifest's recorded
  # range (lockfile-rebuild-survivability §override-alignment): move floor and
  # bound together with it. Bounded to the 0.28 line: esbuild is 0.x, its
  # minors are breaking lines, and an open floor would admit 0.29 unreviewed.
  # Remove when tsup, vite and tsx declare an esbuild range with no release
  # below 0.28.1.
  esbuild: '>=0.28.2 <0.29'
  # Peer alignment, added 2026-09-16: eslint-plugin-tsdoc 0.5.3, its latest
  # release, pins @typescript-eslint/utils ~8.56.0, whose typescript peer stops
  # below 6.0 while the estate's `typescript` alias resolves the 6.0 API — an
  # unmet peer on every install. The rest of the estate resolves the 8.70 line
  # (tooling/eslint declares ^8.70.0; its peer admits typescript <6.1.0). Safe to
  # force: the plugin's only utils call is ESLintUtils.getParserServices, a
  # fallback stable across 8.x, and the tsdoc/syntax rule still reports an
  # undefined tag on the forced line. Qualified to the 0.5 line so a later
  # tsdoc generation escapes the override (and its peer warning returns loudly
  # if it still pins an old utils); bounded below 9, aligned with the manifest.
  # Remove when eslint-plugin-tsdoc's @typescript-eslint/utils range reaches
  # 8.58.0 or later (8.58.0 is the first line whose peer admits TypeScript 6.0).
  'eslint-plugin-tsdoc@0.5>@typescript-eslint/utils': '>=8.70.0 <9'
  # Security floor for fast-uri's run of host-confusion and SSRF advisories.
  # GitHub's reviewed database patches the 3.x line in 3.1.6
  # (GHSA-jqff-g426-hqxp, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf and
  # GHSA-5jgf-p345-68v8, all high). The fast-uri repository's later advisories,
  # absent from the reviewed database on 2026-09-17, patch it in 3.1.7
  # (GHSA-qw65-cvwx-89v3 and GHSA-58mr-gqgx-xq4g, maintainer severity high) and
  # 3.1.8 (GHSA-hrr3-gc8f-f4qj, maintainer severity medium; published
  # 2026-09-15). Dev tooling only: ajv 8 declares fast-uri ^3.0.1, and ajv
  # reaches the tree through agent-tools, commitlint's config validator and
  # eslint-plugin-tsdoc's config loader; the site does not reach it. Bounded
  # below 4 deliberately — 4.x is published, and an open floor would silently
  # adopt a major nobody asked for. Raise the bound when a consumer actually
  # needs fast-uri 4. Remove when ajv's declared fast-uri floor is >=3.1.8.
  fast-uri: '>=3.1.8 <4'
  # Security floor per major line, scoped 2026-09-17: the unscoped '>=4.3.1 <5'
  # had forced markdownlint-cli2's exact js-yaml 5.2.2 down to 4.3.2, across a
  # major. Each line keeps its own patched floor, bounded below its next major.
  # Dev tooling only. A new consumer on another major (3.x is affected below
  # 3.15.2) gets no floor from these entries; the advisory check at its
  # dependency landing must catch it.
  # 4.x: @eslint/eslintrc (the site's ESLint 9 config loader) declares ^4.3.2
  # and cosmiconfig 9.0.2 (commitlint's config loader) ^4.1.0. Floor 4.3.2 for
  # GHSA-2883-xcg3-v3hh (high; CVE-2026-84375; empty merge sources escape
  # maxTotalMergeKeys), after GHSA-5p4m-2wfm-xmqj (high; quadratic !!omap
  # resolution; 4.3.1). Remove when the tree's cosmiconfig declares js-yaml
  # >=4.3.2.
  # 5.x: markdownlint-cli2 0.23.2, its latest release, pins 5.2.2 exactly.
  # Floor 5.4.1 for GHSA-r3ph-w7gj-g6xm (maintainer severity medium; the same
  # merge-source flaw on 5.x), a js-yaml repository advisory absent from
  # GitHub's reviewed database on 2026-09-17, whose newest 5.x entry then,
  # GHSA-pm4m-ph32-ghv5 (high), is patched in 5.2.2. Safe to force from the
  # exact pin within the major: markdownlint-cli2 calls js-yaml's load with
  # default options, whose schema has no merge keys, on .yaml configuration
  # files and as the last-resort parser for others; this repository's
  # configurations are JSON. The
  # breaking entries in the 5.3 and 5.4 changelogs change the AST, the dumper,
  # custom tag definitions and the MERGE_KEY export, not load with default
  # options. Remove when markdownlint-cli2 declares js-yaml >=5.4.1.
  'js-yaml@4': '>=4.3.2 <5'
  'js-yaml@5': '>=5.4.1 <6'
  # Security floor: the markdown-it repository's GHSA-r7fv-28h4-cvq7
  # (maintainer severity high; quadratic smartquotes on unmatched closing
  # quotes; published 2026-09-12), patched in 14.3.2 on the 14 line, after
  # GHSA-253c-mchw-3w2r (maintainer severity medium; quadratic linkify paths;
  # 14.3.1). Both were absent from GitHub's reviewed database on 2026-09-17,
  # whose newest entry then, GHSA-6v5v-wf23-fmfq (medium), is patched in
  # 14.2.0. Its one consumer, markdownlint-cli2 0.23.2, pins markdown-it 14.3.0
  # exactly; the floor moves that pin to a patch release within the major.
  # Bounded below 15 on 2026-09-16: the open floor had rewritten that pin to
  # 15.0.2, a major the linter was not built against. The floor also keeps
  # linkify-it patched without an override of its own: markdown-it 14.3.x
  # declares linkify-it ^5.0.2, the patched release for GHSA-v245-v573-v5vm
  # (high), and markdown-it 15 declares ^6.0.0, outside it. Raise the bound
  # when markdownlint-cli2 moves to markdown-it 15.
  # Remove when markdownlint-cli2 declares markdown-it >=14.3.2.
  markdown-it: '>=14.3.2 <15'
  # Security floor, raised 2026-09-17: GHSA-2v37-7h3g-55p8 (high;
  # CVE-2026-67213; custom generators loop indefinitely when size is zero),
  # patched in 3.3.18 on the 3.x line, after GHSA-28wg-ghj8-5hjv (high; 3.3.16)
  # and GHSA-xwg4-73v4-xw9w (high; 3.3.12). postcss is its only consumer.
  # Bounded below 4 deliberately: postcss declares ^3.x, and an unbounded floor
  # would coerce it onto nanoid's ESM-only later majors. Remove when every
  # postcss the tree can resolve declares nanoid >=3.3.18: 8.5.27 is the first
  # release that does, and the postcss floor below still admits 8.5.26, which
  # declares ^3.3.17.
  nanoid: '>=3.3.18 <4'
  # Security floor per major line, scoped 2026-09-17: GHSA-c2c7-rcm5-vvqj
  # (high; CVE-2026-33671; ReDoS via extglob quantifiers) and GHSA-3v7f-55p6-f55p
  # (medium; CVE-2026-33672; method injection in POSIX character classes), both
  # patched in 2.3.2 and 4.0.4. The unscoped '>=4.0.4' had forced micromatch's
  # declared ^2.3.1 onto picomatch 4, across a major; each line now keeps its
  # own patched floor, bounded below its next major. Dev tooling only. A new
  # consumer on another major (3.x is affected below 3.0.2) gets no floor from
  # these entries; the advisory check at its dependency landing must catch it.
  # 2.x: micromatch 4.0.8, under markdownlint-cli2, fast-glob (through globby)
  # and @next/eslint-plugin-next. Remove when micromatch declares picomatch
  # >=2.3.2.
  # 4.x: dependency-cruiser pins 4.0.7, knip declares ^4.0.7, tinyglobby
  # ^4.0.4, vite 7.3.5 and vitest 4.1.11 ^4.0.3. The 4 selector rewrites
  # dependency-cruiser's exact pin, so a later 4.x release moves it on the next
  # relock, and rewrites fdir's optional peer ^3 || ^4 to this floor. Remove
  # when the tree's vite and vitest declare picomatch >=4.0.4.
  'picomatch@2': '>=2.3.2 <3'
  'picomatch@4': '>=4.0.4 <5'
  # Security floor: postcss's advisories run to GHSA-fxqj-rqcc-2cmp (medium;
  # sourceMappingURL reads arbitrary .map files when `from` is unset), patched
  # in 8.5.23, after GHSA-r28c-9q8g-f849 (high; 8.5.18), GHSA-6g55-p6wh-862q
  # (high; 8.5.12) and GHSA-qx2v-qp2m-jg93 (medium; 8.5.10). The floor sits
  # above them at 8.5.26, aligned with jcdotnet's direct ^8.5.26
  # (lockfile-rebuild-survivability §override-alignment): the override REWRITES
  # that manifest's recorded range, so move them together. Build-time surface:
  # next pins postcss 8.5.23 exactly, which the floor moves within the 8.5
  # line, and @tailwindcss/postcss, vite and tsup's config loader reach it too.
  # Bounded below 9 pre-emptively (no 9.x published at 2026-09-17) — an open
  # floor admits the next major the day it ships. Remove when every dependent
  # declares postcss >=8.5.23 (vite 7.3.5 declares ^8.5.6, @tailwindcss/postcss
  # 4.3.3 ^8.5.16).
  postcss: '>=8.5.26 <9'
  # Security floor: GHSA-mw96-cpmx-2vgc (high; arbitrary file write through
  # path traversal in Rollup 4), patched in 4.59.0. vite 7.3.5 declares rollup
  # ^4.43.0; tsup 8.5.1 and its fix-dts-default-cjs-exports declare ^4.34.8.
  # Build and test tooling only. Bounded below 5 pre-emptively (no 5.x
  # published at 2026-09-17): an open floor admits the next major the day it
  # ships and forces it onto every ^4 dependent. Remove when vite and tsup
  # declare rollup >=4.59.0.
  rollup: '>=4.59.0 <5'
  # Security floor, added 2026-09-16: GHSA-7w5x-hrqm-74c2 (high) in smol-toml
  # <=1.7.0, patched in 1.7.1. markdownlint-cli2 0.23.2, its latest release,
  # pins smol-toml 1.7.0 exactly, so no version move escapes; agent-tools
  # declares ^1.7.1 and knip ^1.8.0. Tree-wide rather than parent-scoped, so a
  # new consumer cannot bring back a vulnerable line. Safe to force from the
  # exact pin: 1.8.0 is a minor release, and markdownlint-cli2 calls smol-toml's
  # parser for a configuration path ending in .toml and as a fallback parser
  # for configuration files that fail to parse as JSONC; this repository's
  # configurations are valid JSON, so the vulnerable path is unreachable here.
  # This override REWRITES agent-tools' recorded range, and while it stands a
  # raised manifest range is silently ignored: move floor and bound together
  # with that manifest. Bounded below 2 pre-emptively; raise the bound when a
  # consumer needs smol-toml 2. Remove when markdownlint-cli2 declares smol-toml
  # >=1.7.1.
  smol-toml: '>=1.7.1 <2'
  # Transitive floor; no advisory names sucrase itself. sucrase 3.35.0 declares
  # glob ^10.3.10, a range whose floor sits inside GHSA-5j98-mcp5-4vw2 (high;
  # command injection through the glob CLI's -c option; patched in 10.5.0);
  # 3.35.1 replaced glob with tinyglobby. tsup 8.5.1, its one consumer,
  # declares ^3.35.0. Bounded below 4 pre-emptively (no 4.x published at
  # 2026-09-17). Remove when tsup declares sucrase >=3.35.1.
  sucrase: '>=3.35.1 <4'
minimumReleaseAgeExclude:
  - prettier@3.9.7
  - '@microsoft/tsdoc-config@0.18.2'
  - '@microsoft/tsdoc@0.17.0'
  - eslint-plugin-tsdoc@0.5.3
  - eslint-plugin-unicorn@75.0.0
