file_opener = "cursor" # or vscode, windsurf, vscode-insiders, none

project_doc_fallback_filenames = ["RULES_INDEX.md"]

[features]
hooks = true
multi_agent = true

[[hooks.SessionStart]]
matcher = "startup|resume"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'node "$(git rev-parse --show-toplevel)/.codex/hooks/practice-session-identity.mjs"'
timeout = 10
statusMessage = "Loading Practice agent identity"

[agents."accessibility-expert"]
description = "Accessibility reviewer focusing on WCAG compliance, semantics, and assistive flows."
config_file = "agents/accessibility-expert.toml"

[agents."architecture-expert"]
description = "Structural architecture reviewer for the monorepo: module structure, import direction, workspace boundaries, dependency-injection patterns and any decision with long-term architectural consequence. Invoke the named persona for the lane a change touches as well."
config_file = "agents/architecture-expert.toml"

[agents."architecture-expert-barney"]
description = "Architecture reviewer Barney focused on PKG and graph integrity."
config_file = "agents/architecture-expert-barney.toml"

[agents."architecture-expert-betty"]
description = "Architecture reviewer Betty ensuring route, navigation, and layout architecture."
config_file = "agents/architecture-expert-betty.toml"

[agents."architecture-expert-fred"]
description = "Architecture reviewer Fred covering builds, caching, PDF generation, Playwright against the production build, and resilience."
config_file = "agents/architecture-expert-fred.toml"

[agents."architecture-expert-wilma"]
description = "Architecture reviewer Wilma focused on practice governance and docs."
config_file = "agents/architecture-expert-wilma.toml"

[agents."assumptions-expert"]
description = "Meta-level plan specialist for both read-only review and active-workflow planning support, focused on proportionality, assumption validity, and blocking legitimacy. Invoke when plans are being drafted, marked decision-complete, propose 3+ agents, assert blocking relationships, integrate a third-party vendor, or commit to technology choices before research."
config_file = "agents/assumptions-expert.toml"

[agents."code-expert"]
description = "Gateway code reviewer — quality, correctness, and triage. Assesses code changes for correctness, edge cases, security, performance, readability, maintainability, and test coverage. Triages to specialists."
config_file = "agents/code-expert.toml"

[agents."config-expert"]
description = "Configuration reviewer for TypeScript, ESLint, Vitest, Prettier, markdownlint, Turbo, knip, dependency-cruiser and Husky configuration, pnpm scripts, and the site's Next.js, PostCSS and Playwright configuration."
config_file = "agents/config-expert.toml"

[agents."corpus-mapper"]
description = "Read-only leaf-signal extractor for the corpus-analysis map workflow stage. Dispatched exclusively via the Workflow agent() agentType option; never invoke for interactive delegation. Reads one time-contiguous window's corpus files in full and answers only through the schema-forced structured output call."
config_file = "agents/corpus-mapper.toml"

[agents."corpus-meta"]
description = "Read-only recall-calibration synthesist for the corpus-analysis meta workflow stage. Dispatched exclusively via the Workflow agent() agentType option; never invoke for interactive delegation. Judges per-baseline recall matches and verifies corroboration home paths on disk before claiming them, answering through the schema-forced structured output call."
config_file = "agents/corpus-meta.toml"

[agents."corpus-reducer"]
description = "No-tools clustering synthesist for the corpus-analysis reduce workflow stage. Dispatched exclusively via the Workflow agent() agentType option; never invoke for interactive delegation. Clusters the inlined leaf signals into mechanism-grained candidates and answers only through the schema-forced structured output call."
config_file = "agents/corpus-reducer.toml"

[agents."corpus-voter"]
description = "Single-turn no-tools adversary voter for the corpus-analysis validate workflow. Dispatched exclusively via the Workflow agent() agentType option; never invoke for interactive delegation. Judges one candidate against the four conjunctive apophenia tests from supplied grounding and answers only through the schema-forced structured output call."
config_file = "agents/corpus-voter.toml"

[agents."cricket-judgement-low"]
description = "Fast low-effort conscience check using contextual judgement. Call directly for a second opinion, rubber duck, or design partnership when priority, proportion, or a wait/gate may be drifting; returns a work verdict (ON-TRACK, DRIFTING or WRONG-PRIORITY) and a frame verdict (SOUND, NARROWED or CONTRADICTED), with evidence and one redirection."
config_file = "agents/cricket-judgement-low.toml"

[agents."cricket-judgement-medium"]
description = "Fast medium-effort conscience check using contextual judgement. Call directly for a second opinion, rubber duck, or design partnership when priority, proportion, or a wait/gate may be drifting; returns a work verdict (ON-TRACK, DRIFTING or WRONG-PRIORITY) and a frame verdict (SOUND, NARROWED or CONTRADICTED), with evidence and one redirection."
config_file = "agents/cricket-judgement-medium.toml"

[agents."cricket-procedure-xhigh"]
description = "Fast xhigh-effort conscience check using a compiled decision procedure with quote-anchored evidence and a mechanical verdict table. Call directly for a reproducible second opinion when priority, proportion, or a wait/gate may be drifting; returns a work verdict (ON-TRACK, DRIFTING or WRONG-PRIORITY) and a mechanically derived frame verdict (SOUND, NARROWED or CONTRADICTED), with one redirection."
config_file = "agents/cricket-procedure-xhigh.toml"

[agents."design-system-expert"]
description = "Design-system reviewer verifying tokens, theming, spacing, typography, motion, and responsive rhythm."
config_file = "agents/design-system-expert.toml"

[agents."docs-adr-expert"]
description = "Documentation and ADR reviewer for decision records and narratives."
config_file = "agents/docs-adr-expert.toml"

[agents."editor"]
description = "Editorial reviewer for Jim Cresswell's public-facing content. Reviews audience fit, attention, structure, readability, voice and consistency — returns actionable feedback without editing files."
config_file = "agents/editor.toml"

[agents."onboarding-expert"]
description = "Onboarding documentation quality specialist. Use proactively when onboarding paths change, new contributors join, or documentation drift is suspected across the human or AI-agent onboarding flows. Invoke immediately after changes to README (especially the Getting Started section), CONTRIBUTING.md, AGENT.md, or any document that sits on an onboarding path."
config_file = "agents/onboarding-expert.toml"

[agents."pkg-expert"]
description = "PKG specialist reviewer — Schema.org, JSON-LD, and graph correctness. Validates entity model and structured data against Schema.org specs, JSON-LD constraints, @id resolution rules, consumer value tiers, and Neo4j forward-compatibility. The graph models reality — every entity is real, every claim must be valid."
config_file = "agents/pkg-expert.toml"

[agents."prose-expert"]
description = "Prose craft specialist. Use proactively to review the writing of any authored document — clarity, concision, active voice, omit-needless-words, lead-with-the-point. Read-only craft review; defers Jim's editorial voice to editor, link text, headings, labels and accessible names on rendered surfaces to accessibility-expert, onboarding journeys to onboarding-expert, and documentation structure/accuracy to docs-adr-expert."
config_file = "agents/prose-expert.toml"

[agents."react-component-expert"]
description = "React component reviewer checking hooks, hydration, and memoisation."
config_file = "agents/react-component-expert.toml"

[agents."release-readiness-expert"]
description = "Release go/no-go specialist. Synthesises quality-gate evidence, breaking-change risk, migration impact, and operational readiness into an explicit GO / GO WITH CONDITIONS / NO-GO recommendation. Use at release boundaries: before merging to a release branch, before a version bump, when a change set includes contract or schema changes, or when a prior NO-GO is being re-evaluated after fixes."
config_file = "agents/release-readiness-expert.toml"

[agents."security-expert"]
description = "Security reviewer for headers, secrets, and middleware defences."
config_file = "agents/security-expert.toml"

[agents."subagent-architect"]
description = "Subagent architect ensuring the canonical reviewer architecture stays sane."
config_file = "agents/subagent-architect.toml"

[agents."test-expert"]
description = "Test quality and TDD compliance reviewer. Classifies tests, verifies naming conventions, checks mock simplicity, assesses test value, and recommends deletion for tests that test mocks or types."
config_file = "agents/test-expert.toml"

[agents."type-expert"]
description = "TypeScript type safety reviewer. Traces type flow from origin through the system. Detects widening, assertions, and missed compile-time guarantees. Core principle: why solve at runtime what you can embed at compile time?."
config_file = "agents/type-expert.toml"
